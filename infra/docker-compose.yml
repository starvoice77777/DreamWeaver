services:
  postgres:
    image: postgres:alpine
    environment:
      POSTGRES_DB: dreamweaver
      POSTGRES_USER: dreamweaver
      POSTGRES_PASSWORD: dreamweaver
    ports:
      - "5432:5432"
    volumes:
      - ./.data/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dreamweaver -d dreamweaver"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - ./.data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: dreamweaver
      MINIO_ROOT_PASSWORD: dreamweaver-local-only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./.data/minio:/data

  api:
    build:
      context: ../server
    env_file:
      - ../server/.env
    environment:
      DW_DATABASE_URL: postgresql+asyncpg://dreamweaver:dreamweaver@postgres:5432/dreamweaver
      DW_REDIS_URL: redis://redis:6379/0
      DW_OBJECT_STORAGE_ENDPOINT: minio:9000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  worker:
    build:
      context: ../server
    command: celery -A app.workers.celery_app:celery_app worker --loglevel=INFO
    env_file:
      - ../server/.env
    environment:
      DW_DATABASE_URL: postgresql+asyncpg://dreamweaver:dreamweaver@postgres:5432/dreamweaver
      DW_REDIS_URL: redis://redis:6379/0
      DW_OBJECT_STORAGE_ENDPOINT: minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

