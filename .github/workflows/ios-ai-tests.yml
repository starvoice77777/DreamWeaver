name: ios-ai-tests

on:
  pull_request:
    paths:
      - "DreamWeaver/**"
      - "DreamWeaverTests/**"
      - "DreamWeaver.xcodeproj/**"
      - ".github/workflows/ios-ai-tests.yml"

permissions:
  contents: read

concurrency:
  group: ios-ai-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  remote-ai-service:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - name: Select an available iOS 26 iPhone simulator
        id: simulator
        run: |
          xcodebuild -version
          device_id=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          matches = [d["udid"] for runtime, entries in devices.items()
                     if ".iOS-26-" in runtime for d in entries
                     if d["name"].startswith("iPhone") and d["isAvailable"]]
          if not matches:
              sys.exit("No available iOS 26 iPhone simulator")
          print(matches[0])')
          echo "id=$device_id" >> "$GITHUB_OUTPUT"

      - name: Test RemoteAISceneService
        run: |
          xcodebuild test \
            -project DreamWeaver.xcodeproj \
            -scheme DreamWeaver \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}" \
            -only-testing:DreamWeaverTests/RemoteAISceneServiceTests \
            -parallel-testing-enabled NO \
            -resultBundlePath TestResults/RemoteAISceneService.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remote-ai-service-results
          path: TestResults/*.xcresult
          if-no-files-found: warn
          retention-days: 7
