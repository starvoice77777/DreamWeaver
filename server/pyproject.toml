[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dreamweaver-server"
version = "0.1.0"
description = "DreamWeaver production backend"
requires-python = ">=3.12"
dependencies = [
    "alembic",
    "asyncpg",
    "celery[redis]",
    "fastapi",
    "httpx",
    "minio",
    "psycopg[binary]",
    "pydantic-settings",
    "PyJWT[crypto]",
    "sqlalchemy[asyncio]",
    "uvicorn[standard]",
]

[project.optional-dependencies]
dev = [
    "aiosqlite",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

